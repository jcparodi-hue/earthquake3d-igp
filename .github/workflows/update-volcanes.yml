name: Actualizar VOLCANO PULSE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: volcano-pulse-update
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  update-volcanoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar USGS, CENVUL y NOAA VAAC
        run: python volcanes.py

      - name: Guardar datos volcanicos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/volcanes_mundiales.json docs/alertas_volcanes_usgs.json docs/alertas_volcanes_usgs_elevadas.json docs/boletines_volcanes_peru.json docs/avisos_ceniza_noaa.json docs/estado_volcanes.json
          if git diff --cached --quiet; then
            echo "No hay cambios volcanicos para guardar"
            exit 0
          fi
          git commit -m "Actualizar VOLCANO PULSE"
          git pull --rebase origin main
          git push origin main
