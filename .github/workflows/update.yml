name: Actualizar feed IGP para Earthquake 3D
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convertir datos del IGP
        run: python convert.py
      - name: Guardar CSV actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/igp_7dias_eq3d.csv
          git diff --cached --quiet || git commit -m "Actualizar sismos IGP"
          git push
