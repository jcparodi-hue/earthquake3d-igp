name: Actualizar feed IGP EMSC USGS para Earthquake 3D

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: earthquake3d-feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Combinar IGP EMSC USGS
        run: python convert.py

      - name: Guardar archivos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.csv docs/*.json docs/*.txt
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
            exit 0
          fi
          git commit -m "Actualizar feed sismico combinado"
          git pull --rebase origin main
          git push origin main
