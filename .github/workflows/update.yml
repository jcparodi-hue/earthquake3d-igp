name: Actualizar feed IGP EMSC USGS para Earthquake 3D

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Combinar IGP EMSC USGS
        run: python convert.py

      - name: Guardar CSV actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.csv
          git diff --cached --quiet || git commit -m "Actualizar feed sismico combinado"
          git push
